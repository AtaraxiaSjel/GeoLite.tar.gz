name: Sync and Archive External GeoLite

on:
  schedule:
    - cron: '0 4 * * *'
  push:
  workflow_dispatch:

jobs:
  check-and-archive:
    name: Check for New Release and Archive
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: "P3TERX/GeoLite.mmdb"
    permissions:
      contents: write
    outputs:
      new_release_created: ${{ steps.check_tag.outputs.new_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch all history for all tags to compare against
          fetch-depth: 0

      - name: Get latest release from target repository
        id: get_latest_release
        run: |
          release_info=$(curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ env.TARGET_REPO }}/releases/latest")
          tag_name=$(echo "$release_info" | jq -r '.tag_name')
          if [ -z "$tag_name" ] || [ "$tag_name" == "null" ]; then
            echo "ERROR: Could not find the latest release for ${{ env.TARGET_REPO }}"
            exit 1
          fi
          echo "tag=${tag_name}" >> $GITHUB_OUTPUT
          echo "assets_url=$(echo "$release_info" | jq -r '.assets_url')" >> $GITHUB_OUTPUT
          echo "release_name=$(echo "$release_info" | jq -r '.name')" >> $GITHUB_OUTPUT
          echo "release_body=$(echo "$release_info" | jq -r '.body')" >> $GITHUB_OUTPUT

      - name: Check if release tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.get_latest_release.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.get_latest_release.outputs.tag }} already exists. Nothing to do."
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release found: ${{ steps.get_latest_release.outputs.tag }}. Proceeding."
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets
        if: steps.check_tag.outputs.new_release == 'true'
        run: |
          mkdir ./release-assets
          assets_json=$(curl -s -H "Accept: application/vnd.github.v3+json" "${{ steps.get_latest_release.outputs.assets_url }}")
          echo "$assets_json" | jq -r '.[].browser_download_url' | xargs -n 1 wget -P ./release-assets/

      - name: Create tar.gz archive
        if: steps.check_tag.outputs.new_release == 'true'
        id: archive
        run: |
          archive_name="GeoLite.tar.gz"
          tar -czvf "${archive_name}" -C ./release-assets/ .
          echo "name=${archive_name}" >> $GITHUB_OUTPUT

      - name: Create a new release in this repository
        if: steps.check_tag.outputs.new_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_latest_release.outputs.tag }}
          name: "Release ${{ steps.get_latest_release.outputs.tag }} (archived)"
          body: |
            Automated archive of release from ${{ env.TARGET_REPO }}.

            ---
            Original release description:
            ${{ steps.get_latest_release.outputs.release_body }}
          files: ${{ steps.archive.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-old-releases:
    name: Clean Up Old Releases
    runs-on: ubuntu-latest
    needs: check-and-archive
    if: needs.check-and-archive.outputs.new_release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Clean up old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching a list of all releases..."
          RELEASES_TO_DELETE=$( \
            gh release list --json tagName --jq 'sort_by(.tagName) | reverse | .[].tagName' | tail -n +4 \
          )
          if [ -z "$RELEASES_TO_DELETE" ]; then
            echo "No old releases to delete. Found 3 or fewer releases."
          else
            echo "The following old releases will be deleted:"
            echo "$RELEASES_TO_DELETE"
            for tag in $RELEASES_TO_DELETE; do
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --yes
              git push origin --delete "$tag"
            done
          fi
          echo "Cleanup complete."
